<section id="network-inventory-workspace" class="panel hidden" aria-label="OT Network Inventory">
    <div class="inventory-toolbar inventory-topbar">
        <label class="inventory-network-label">Network <select id="inventory-network" aria-label="Network"><option value="all">All Networks</option></select></label>
        <button type="button" id="inventory-scan">Scan Now</button>
        <button type="button" id="inventory-refresh">Refresh Inventory</button>
        <button type="button" id="inventory-free">Show Candidate Free IPs</button>
        <span id="inventory-range">IP range: —</span>
        <span id="inventory-freshness">Scanned: Never</span>
    </div>
    <div class="inventory-toolbar">
        <div class="inventory-search">
            <input id="inventory-search" type="search" aria-label="Search IP, machine, vendor or location" placeholder="172.28.231.45, Packing, Siemens, Camera…">
        </div>
        <label>Filter <select id="inventory-filter">
            <option>All</option><option>Online</option><option>Offline Known</option><option>Unknown</option>
            <option>Candidate Free</option><option>Kepware</option><option>Manual</option><option>Scan Only</option>
        </select></label>
        <label>Sort <select id="inventory-sort">
            <option value="IPAddress">IP Address</option><option value="MachineName">Machine Name</option>
            <option value="Status">Status</option><option value="LastSeen">Last Seen</option>
        </select></label>
        <label><input id="inventory-descending" type="checkbox"> Descending</label>
    </div>
    <p id="inventory-message" role="status" aria-live="polite"></p>
    <form id="inventory-manual">
        <div class="inventory-manual-heading"><strong>Manual Identity / reservation</strong><span id="inventory-manual-selection" aria-live="polite">Select an IP to edit</span></div>
        <div class="inventory-toolbar">
            <label>Machine Name <input name="MachineName" maxlength="2000" disabled></label>
            <label>Description <input name="Description" maxlength="2000" disabled></label>
            <label>Location <input name="Location" maxlength="2000" disabled></label>
            <label>Remark <input name="Remark" maxlength="2000" disabled></label>
            <label>Verified Vendor <input name="Vendor" maxlength="512" disabled></label>
            <label>Verified Device Type <input name="DeviceType" maxlength="512" disabled></label>
            <button id="inventory-manual-save" type="submit" disabled>Save New Manual Revision</button>
        </div>
        <p id="inventory-manual-message" role="status"></p>
    </form>
    <div class="inventory-table-scroll">
        <table class="inventory-table inventory-main-table"><colgroup>
            <col class="inventory-col-ip"><col class="inventory-col-name"><col class="inventory-col-status">
            <col class="inventory-col-device"><col class="inventory-col-seen"><col class="inventory-col-description">
            <col class="inventory-col-vendor"><col class="inventory-col-type">
            <col id="inventory-network-col" class="inventory-col-network" hidden>
        </colgroup><thead><tr>
            <th>IP Address</th><th>Machine Name</th><th>Status</th><th>Kepware Device</th>
            <th>Last Seen</th><th>Description / Location</th><th>Vendor</th><th>Device Type</th>
            <th id="inventory-network-heading" hidden>Network</th>
        </tr></thead><tbody id="inventory-rows"></tbody></table>
    </div>
    <section id="inventory-detail" class="hidden" aria-label="IP details">
        <h3 id="inventory-detail-title"></h3>
        <dl id="inventory-current" class="object-properties"></dl>
        <p id="inventory-detail-message" role="status"></p>
        <div id="inventory-histories"></div>
    </section>
</section>
